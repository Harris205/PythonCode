<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数学表达式绘图器</title>
  <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.3/lib/browser/math.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root { --ink:#17211b; --paper:#f4f1e8; --panel:#fffdf7; --accent:#e85d36; --green:#237a57; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:linear-gradient(135deg,#e8e5d8 0%,#f8f5ed 58%,#dfe9df 100%); font-family:"Segoe UI",sans-serif; }
    header { display:flex; align-items:end; justify-content:space-between; gap:1rem; padding:24px clamp(18px,4vw,56px) 18px; }
    h1 { margin:0; max-width:760px; font-family:Georgia,"Times New Roman",serif; font-size:clamp(32px,5vw,66px); line-height:.92; }
    .tag { color:#fff; background:var(--green); padding:8px 12px; border-radius:4px; font-size:13px; }
    main { display:grid; grid-template-columns:minmax(280px,360px) minmax(0,1fr); gap:18px; padding:0 clamp(18px,4vw,56px) 32px; }
    .panel { background:var(--panel); border:1px solid #cfcbbf; border-radius:8px; box-shadow:0 14px 40px rgba(31,42,35,.08); }
    form { padding:22px; display:grid; gap:16px; }
    label { display:grid; gap:7px; font-weight:700; }
    input { width:100%; border:1px solid #b9b5a9; border-radius:5px; background:#fff; padding:12px 13px; color:var(--ink); font:15px "Consolas","Courier New",monospace; }
    input:focus { outline:3px solid rgba(232,93,54,.16); border-color:var(--accent); }
    button { border:0; border-radius:5px; padding:13px 18px; color:#fff; background:var(--accent); font-weight:800; cursor:pointer; }
    .hint { color:#67665f; font-size:12px; line-height:1.5; }
    #error { display:none; border-left:4px solid #c83f36; padding:12px; background:#fff0ed; }
    #suggestion { display:none; gap:8px; }
    #suggestion code { display:block; background:#f2efe4; padding:8px; overflow-wrap:anywhere; }
    #plot { min-height:640px; overflow:hidden; }
    #status { min-height:18px; color:#67665f; font-size:13px; }
    @media(max-width:850px) { header { align-items:flex-start; } main { grid-template-columns:1fr; } #plot { min-height:520px; } }
  </style>
</head>
<body>
  <header>
    <h1>把表达式<br>变成空间。</h1>
    <div class="tag">纯静态 · 访问者本地计算</div>
  </header>
  <main>
    <aside class="panel">
      <form id="plot-form">
        <label>数学表达式
          <input id="expression" value="sin(x) + cos(y)" spellcheck="false">
        </label>
        <label>定义域
          <input id="domain" value="x=-5,5; y=-5,5" spellcheck="false">
        </label>
        <div class="hint">支持 1–3 个变量。例：x=-5,5; y=-5,5。自然对数用 ln(x)，常数使用 e 或 pi。</div>
        <button type="submit">绘制图像</button>
        <div id="status"></div>
        <div id="error"></div>
        <div id="suggestion"><strong>可直接粘贴的修正</strong><code id="fixed"></code></div>
      </form>
    </aside>
    <section id="plot" class="panel"></section>
  </main>
  <script>
    const expressionInput = document.querySelector('#expression');
    const domainInput = document.querySelector('#domain');
    const status = document.querySelector('#status');
    const errorBox = document.querySelector('#error');
    const suggestion = document.querySelector('#suggestion');
    const fixedCode = document.querySelector('#fixed');

    function normalizeText(text) {
      let value = text.trim().replace(/\s*\^\s*/g, '^').replace(/\*\*/g, '^');
      value = value.replace(/^\s*[A-Za-z_]\w*\s*=\s*/, '').replace(/；/g, ';');
      value = value.replace(/\b(ln|log)\s+([A-Za-z_]\w*)\b/g, '$1($2)');
      value = value.replace(/\b(ln|log)([A-Za-z_]\w*)\b/g, '$1($2)');
      value = value.replace(/\b(sin|cos|tan|asin|acos|atan|exp|sqrt|abs)\s+([A-Za-z_]\w*)\b/g, '$1($2)');
      value = value.replace(/(?<![A-Za-z0-9_])(\d+(?:\.\d+)?)\s*(?=[A-Za-z_]\w*)/g, '$1*');
      return value.replace(/\s+/g, '');
    }

    function parseDomain(text, variables) {
      const pieces = text.match(/[A-Za-z_]\w*\s*(?:=|in)\s*\[?\s*[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?\s*,\s*[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?\s*\]?/g) || [];
      if (pieces.length !== variables.length) throw new Error(`需要为 ${variables.length} 个变量分别输入区间`);
      const domains = {};
      for (const piece of pieces) {
        const match = piece.match(/^\s*([A-Za-z_]\w*)\s*(?:=|in)\s*\[?\s*([^,]+?)\s*,\s*(.+?)\s*\]?$/);
        if (!match) throw new Error('区间格式应为 x=-10,10 或 x in [-10,10]');
        const endpoint = value => math.evaluate(value.replace(/\bpi\b/g, String(Math.PI)).replace(/\b-e\b/g, String(-Math.E)).replace(/\be\b/g, String(Math.E)));
        const lower = endpoint(match[2]);
        const upper = endpoint(match[3]);
        if (!Number.isFinite(lower) || !Number.isFinite(upper)) throw new Error('区间端点必须是有限数字');
        if (lower >= upper) throw new Error(`变量 ${match[1]} 的下限必须小于上限`);
        if (!variables.includes(match[1])) throw new Error(`未知变量：${match[1]}`);
        domains[match[1]] = [lower, upper];
      }
      if (Object.keys(domains).length !== variables.length) throw new Error('存在重复变量或缺少变量区间');
      return domains;
    }

    function parseExpression(text) {
      const normalized = normalizeText(text);
      const node = math.parse(normalized);
      const functions = new Set(['sin','cos','tan','asin','acos','atan','atan2','sinh','cosh','tanh','exp','log','ln','sqrt','abs']);
      const variables = node.filter(node => node.isSymbolNode && !functions.has(node.name) && !math[node.name] && node.name !== 'e' && node.name !== 'pi').map(node => node.name);
      const unique = [...new Set(variables)].sort();
      if (!unique.length) throw new Error('表达式中至少需要一个变量');
      if (unique.length > 3) throw new Error('最多支持三个变量');
      return { normalized, node, variables: unique };
    }

    function linspace([start, end], count) {
      if (count === 1) return [start];
      return Array.from({length: count}, (_, index) => start + (end - start) * index / (count - 1));
    }

    function flattenGrid(xs, ys) {
      const x = [], y = [];
      for (const yi of ys) for (const xi of xs) { x.push(xi); y.push(yi); }
      return { x, y };
    }

    function safeValue(node, scope) {
      try {
        const value = node.evaluate(scope);
        return typeof value === 'number' && Number.isFinite(value) ? value : null;
      } catch (_) { return null; }
    }

    function buildPlot(expression, domain) {
      const parsed = parseExpression(expression);
      const domains = parseDomain(domain, parsed.variables);
      const scope = {};

      if (parsed.variables.length === 1) {
        const name = parsed.variables[0];
        const xs = linspace(domains[name], 1000);
        const values = xs.map(x => safeValue(parsed.node, { [name]: x }));
        return { data:[{type:'scatter', mode:'lines', x:xs, y:values}], layout:{title:'Curve', xaxis:{title:name}, yaxis:{title:'function value'}, template:'plotly_white', height:640} };
      }

      if (parsed.variables.length === 2) {
        const [nameX, nameY] = parsed.variables;
        const xs = linspace(domains[nameX], 150), ys = linspace(domains[nameY], 150);
        const grid = flattenGrid(xs, ys);
        const z = grid.x.map((x, index) => safeValue(parsed.node, { [nameX]: x, [nameY]: grid.y[index] }));
        const zMatrix = [];
        for (let row = 0; row < ys.length; row++) zMatrix.push(z.slice(row * xs.length, (row + 1) * xs.length));
        return { data:[{type:'surface', x:xs, y:ys, z:zMatrix, colorscale:'Viridis'}], layout:{title:'Surface', scene:{xaxis:{title:nameX},yaxis:{title:nameY},zaxis:{title:'function value'}}, template:'plotly_white', height:720} };
      }

      const [nameX, nameY, nameZ] = parsed.variables;
      const xs = linspace(domains[nameX], 18), ys = linspace(domains[nameY], 18), zs = linspace(domains[nameZ], 18);
      const points = {x:[], y:[], z:[], color:[]};
      for (const z of zs) for (const y of ys) for (const x of xs) {
        const value = safeValue(parsed.node, { [nameX]: x, [nameY]: y, [nameZ]: z });
        if (value !== null) { points.x.push(x); points.y.push(y); points.z.push(z); points.color.push(value); }
      }
      if (!points.x.length) throw new Error('定义域内没有有限函数值');
      return { data:[{type:'scatter3d', mode:'markers', x:points.x, y:points.y, z:points.z, marker:{size:2.8,color:points.color,colorscale:'Portland',opacity:.8}}], layout:{title:'3D point cloud', scene:{xaxis:{title:nameX},yaxis:{title:nameY},zaxis:{title:nameZ}}, template:'plotly_white', height:720} };
    }

    function draw() {
      status.textContent = '正在计算采样点…';
      errorBox.style.display = 'none';
      suggestion.style.display = 'none';
      try {
        const plot = buildPlot(expressionInput.value, domainInput.value);
        Plotly.react('plot', plot.data, plot.layout, {responsive:true});
        status.textContent = '绘制完成';
      } catch (error) {
        const corrected = normalizeText(expressionInput.value);
        errorBox.textContent = error.message || String(error);
        errorBox.style.display = 'block';
        try { parseExpression(corrected); fixedCode.textContent = corrected; suggestion.style.display = 'grid'; }
        catch (_) { fixedCode.textContent = ''; suggestion.style.display = 'none'; }
        status.textContent = '';
      }
    }

    document.querySelector('#plot-form').addEventListener('submit', event => { event.preventDefault(); draw(); });
    fixedCode.addEventListener('click', () => { expressionInput.value = fixedCode.textContent; draw(); });
    draw();
  </script>
</body>
</html>
