<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数学表达式绘图器</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root { --ink:#17211b; --paper:#f4f1e8; --panel:#fffdf7; --accent:#e85d36; --green:#237a57; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:linear-gradient(135deg,#e8e5d8 0%,#f8f5ed 58%,#dfe9df 100%); font-family:"Segoe UI",sans-serif; }
    header { display:flex; align-items:end; justify-content:space-between; gap:1rem; padding:24px clamp(18px,4vw,56px) 18px; }
    h1 { margin:0; max-width:760px; font-family:Georgia,"Times New Roman",serif; font-size:clamp(32px,5vw,66px); line-height:.92; font-weight:700; }
    .tag { color:#fff; background:var(--green); padding:8px 12px; border-radius:4px; font-size:13px; white-space:nowrap; }
    main { display:grid; grid-template-columns:minmax(280px,360px) minmax(0,1fr); gap:18px; padding:0 clamp(18px,4vw,56px) 32px; }
    .panel { background:var(--panel); border:1px solid #cfcbbf; border-radius:8px; box-shadow:0 14px 40px rgba(31,42,35,.08); }
    form { padding:22px; display:grid; gap:16px; }
    label { display:grid; gap:7px; font-weight:700; }
    input { width:100%; border:1px solid #b9b5a9; border-radius:5px; background:#fff; padding:12px 13px; color:var(--ink); font:15px "Consolas","Courier New",monospace; }
    input:focus { outline:3px solid rgba(232,93,54,.16); border-color:var(--accent); }
    button { border:0; border-radius:5px; padding:13px 18px; color:#fff; background:var(--accent); font-weight:800; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    .hint { color:#67665f; font-size:12px; line-height:1.5; }
    #error { display:none; border-left:4px solid #c83f36; padding:12px; background:#fff0ed; }
    #suggestions { display:none; gap:8px; }
    #suggestions code { display:block; background:#f2efe4; padding:8px; overflow-wrap:anywhere; }
    #plot { min-height:640px; overflow:hidden; }
    #status { height:18px; color:#67665f; font-size:13px; }
    @media(max-width:850px) { header { align-items:flex-start; } main { grid-template-columns:1fr; } #plot { min-height:520px; } }
  </style>
</head>
<body>
  <header>
    <h1>把表达式<br>变成空间。</h1>
    <div class="tag">本地绘图器 · 1–3 维</div>
  </header>
  <main>
    <aside class="panel">
      <form id="plot-form">
        <label>数学表达式
          <input id="expression" name="expression" value="sin(x) + cos(y)" spellcheck="false">
        </label>
        <label>定义域
          <input id="domain" name="domain" value="x=-5,5; y=-5,5" spellcheck="false">
        </label>
        <div class="hint">支持 1–3 个变量。分号分隔多个区间，例如 x=-5,5; y=-5,5。</div>
        <button id="draw" type="submit">绘制图像</button>
        <div id="status"></div>
        <div id="error"></div>
        <div id="suggestions">
          <strong>可直接粘贴的修正</strong>
          <code id="expression-suggestion"></code>
          <code id="domain-suggestion"></code>
        </div>
      </form>
    </aside>
    <section id="plot" class="panel"></section>
  </main>
  <script>
    const form = document.querySelector('#plot-form');
    const button = document.querySelector('#draw');
    const status = document.querySelector('#status');
    const error = document.querySelector('#error');
    const suggestions = document.querySelector('#suggestions');

    async function draw() {
      button.disabled = true;
      status.textContent = '正在计算采样点…';
      error.style.display = 'none';
      suggestions.style.display = 'none';
      try {
        const response = await fetch('/api/plot', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({expression: document.querySelector('#expression').value, domain: document.querySelector('#domain').value})
        });
        const payload = await response.json();
        if (!payload.ok) throw payload;
        Plotly.react('plot', payload.figure.data, payload.figure.layout, {responsive:true});
        status.textContent = '绘制完成';
      } catch (payload) {
        error.textContent = payload.error || '绘制失败';
        error.style.display = 'block';
        if (payload.suggested_expression || payload.suggested_domain) {
          document.querySelector('#expression-suggestion').textContent = payload.suggested_expression || '';
          document.querySelector('#domain-suggestion').textContent = payload.suggested_domain || '';
          suggestions.style.display = 'grid';
        }
        status.textContent = '';
      } finally { button.disabled = false; }
    }

    form.addEventListener('submit', event => { event.preventDefault(); draw(); });
    document.querySelector('#expression-suggestion').addEventListener('click', event => { document.querySelector('#expression').value = event.target.textContent; });
    document.querySelector('#domain-suggestion').addEventListener('click', event => { document.querySelector('#domain').value = event.target.textContent; });
    draw();
  </script>
</body>
</html>
