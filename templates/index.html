<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数学表达式绘图器</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root { --ink:#eef7ff; --paper:#070b16; --panel:#0e1626; --accent:#ff2bd6; --green:#00e5ff; --muted:#91a4bd; }
    * { box-sizing:border-box; }
    body { position:relative; isolation:isolate; margin:0; min-height:100vh; overflow-x:hidden; color:var(--ink); background:radial-gradient(circle at 50% -10%,#192956 0,#0b1224 35%,#05070e 100%); font-family:"Segoe UI",sans-serif; }
    body::before { position:fixed; z-index:-1; inset:0; background:linear-gradient(rgba(0,229,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.08) 1px,transparent 1px); background-size:42px 42px; mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 90%); content:""; }
    body::after { position:fixed; z-index:-1; inset:0; background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 4px 5px); pointer-events:none; content:""; }
    header { position:relative; display:flex; align-items:center; justify-content:center; gap:1rem; padding:30px clamp(18px,4vw,56px) 26px; min-height:180px; }
    h1 { position:relative; margin:0; max-width:900px; font-family:"Arial Black","Bahnschrift","Microsoft YaHei",sans-serif; font-size:clamp(46px,7vw,116px); line-height:.94; font-weight:900; letter-spacing:.08em; text-align:center; color:#f7fbff; transform:skew(-6deg); text-shadow:-5px 0 #00e5ff,5px 0 #ff2bd6,0 0 12px rgba(255,43,214,.9),0 0 32px rgba(0,229,255,.45); }
    h1::before, h1::after { position:absolute; inset:0; overflow:hidden; color:#fff; pointer-events:none; content:attr(data-text); }
    h1::before { left:3px; color:#00e5ff; clip-path:inset(0 0 58% 0); animation:glitch-top 3.2s infinite steps(2,end); }
    h1::after { left:-3px; color:#ff2bd6; clip-path:inset(62% 0 0 0); animation:glitch-bottom 2.7s infinite steps(2,end); }
    @keyframes glitch-top { 0%,86%,100% { transform:translate(0); } 88% { transform:translate(-8px,-2px); } 90% { transform:translate(5px,1px); } }
    @keyframes glitch-bottom { 0%,78%,100% { transform:translate(0); } 80% { transform:translate(7px,2px); } 82% { transform:translate(-4px,-1px); } }
    .header-meta { position:absolute; right:clamp(18px,4vw,56px); top:24px; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
    .credit { color:#91a4bd; font-size:13px; white-space:nowrap; }
    main { display:grid; grid-template-columns:minmax(280px,360px) minmax(0,1fr); gap:18px; padding:0 clamp(18px,4vw,56px) 32px; }
    .panel { background:linear-gradient(145deg,rgba(16,28,49,.96),rgba(8,14,27,.96)); border:1px solid rgba(0,229,255,.45); border-radius:4px; box-shadow:0 0 0 1px rgba(255,43,214,.12),0 0 24px rgba(0,229,255,.14),inset 0 0 22px rgba(0,229,255,.035); }
    form { padding:22px; display:grid; gap:16px; }
    label { display:grid; gap:7px; color:#d9ecff; font-weight:700; }
    input { width:100%; border:1px solid #37516e; border-radius:2px; background:#070d19; padding:12px 13px; color:#eaf7ff; font:15px "Consolas","Courier New",monospace; }
    input:focus { outline:3px solid rgba(0,229,255,.15); border-color:var(--green); box-shadow:0 0 12px rgba(0,229,255,.25); }
    button { border:1px solid #ff2bd6; border-radius:2px; padding:13px 18px; color:#fff; background:linear-gradient(90deg,#d51bb7,#ff2bd6); font-weight:800; cursor:pointer; text-transform:uppercase; letter-spacing:.08em; box-shadow:0 0 16px rgba(255,43,214,.35); }
    button:disabled { opacity:.55; cursor:wait; }
    .hint { color:var(--muted); font-size:12px; line-height:1.5; }
    #error { display:none; border-left:4px solid #ff2bd6; padding:12px; color:#ffd7f8; background:rgba(255,43,214,.1); }
    #suggestions { display:none; gap:8px; }
    #suggestions code { display:block; color:#b9f8ff; background:#071d2b; padding:8px; overflow-wrap:anywhere; }
    #plot { min-height:640px; overflow:hidden; }
    #status { height:18px; color:#7eefff; font-size:13px; }
    @media(max-width:850px) { header { align-items:flex-start; min-height:150px; padding-top:90px; } .header-meta { top:18px; } h1 { font-size:clamp(34px,10vw,72px); letter-spacing:.04em; } main { grid-template-columns:1fr; } #plot { min-height:520px; } }
  </style>
</head>
<body>
  <header>
    <h1 data-text="把表达式变成空间">把表达式变成空间</h1>
    <div class="header-meta">
      <div class="tag">本地绘图器 · 1–3 维</div>
      <div class="credit">© Harris205 · 非商业使用 · <a href="https://github.com/Harris205/PythonCode" target="_blank" rel="noopener">项目来源</a></div>
    </div>
  </header>
  <main>
    <aside class="panel">
      <form id="plot-form">
        <label>数学表达式
          <input id="expression" name="expression" value="sin(x) + cos(y)" spellcheck="false">
        </label>
        <label>定义域
          <input id="domain" name="domain" value="x=-5,5; y=-5,5" spellcheck="false">
        </label>
        <div class="hint">支持 1–3 个变量。分号分隔多个区间，例如 x=-5,5; y=-5,5。</div>
        <button id="draw" type="submit">绘制图像</button>
        <div id="status"></div>
        <div id="error"></div>
        <div id="suggestions">
          <strong>可直接粘贴的修正</strong>
          <code id="expression-suggestion"></code>
          <code id="domain-suggestion"></code>
        </div>
      </form>
    </aside>
    <section id="plot" class="panel"></section>
  </main>
  <script>
    const form = document.querySelector('#plot-form');
    const button = document.querySelector('#draw');
    const status = document.querySelector('#status');
    const error = document.querySelector('#error');
    const suggestions = document.querySelector('#suggestions');

    async function draw() {
      button.disabled = true;
      status.textContent = '正在计算采样点…';
      error.style.display = 'none';
      suggestions.style.display = 'none';
      try {
        const response = await fetch('/api/plot', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({expression: document.querySelector('#expression').value, domain: document.querySelector('#domain').value})
        });
        const payload = await response.json();
        if (!payload.ok) throw payload;
        Plotly.react('plot', payload.figure.data, payload.figure.layout, {responsive:true});
        status.textContent = '绘制完成';
      } catch (payload) {
        error.textContent = payload.error || '绘制失败';
        error.style.display = 'block';
        if (payload.suggested_expression || payload.suggested_domain) {
          document.querySelector('#expression-suggestion').textContent = payload.suggested_expression || '';
          document.querySelector('#domain-suggestion').textContent = payload.suggested_domain || '';
          suggestions.style.display = 'grid';
        }
        status.textContent = '';
      } finally { button.disabled = false; }
    }

    form.addEventListener('submit', event => { event.preventDefault(); draw(); });
    document.querySelector('#expression-suggestion').addEventListener('click', event => { document.querySelector('#expression').value = event.target.textContent; });
    document.querySelector('#domain-suggestion').addEventListener('click', event => { document.querySelector('#domain').value = event.target.textContent; });
    draw();
  </script>
</body>
</html>
